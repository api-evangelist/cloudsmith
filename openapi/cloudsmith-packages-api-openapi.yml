definitions:
  ErrorDetail:
    required:
    - detail
    type: object
    properties:
      detail:
        title: Detail
        description: An extended message for the response.
        type: string
        minLength: 1
      fields:
        title: Fields
        description: 'A Dictionary of related errors where key: Field and value: Array of Errors related to that field'
        type: object
        additionalProperties:
          type: array
          items:
            type: string
            minLength: 1
  VagrantPackageUpload:
    required:
    - name
    - provider
    - version
    type: object
    properties:
      architectures:
        type: array
        items:
          $ref: '#/definitions/Architecture'
        readOnly: true
      cdn_url:
        title: Cdn url
        type: string
        readOnly: true
        x-nullable: true
      checksum_md5:
        title: Checksum md5
        type: string
        readOnly: true
      checksum_sha1:
        title: Checksum sha1
        type: string
        readOnly: true
      checksum_sha256:
        title: Checksum sha256
        type: string
        readOnly: true
      checksum_sha512:
        title: Checksum sha512
        type: string
        readOnly: true
      dependencies_checksum_md5:
        title: Dependencies checksum md5
        description: A checksum of all of the package's dependencies.
        type: string
        readOnly: true
        x-nullable: true
      dependencies_url:
        title: Dependencies url
        type: string
        format: uri
        readOnly: true
      description:
        title: Description
        description: A textual description of this package.
        type: string
        readOnly: true
        x-nullable: true
      display_name:
        title: Display name
        type: string
        readOnly: true
      distro:
        $ref: '#/definitions/Distribution'
      distro_version:
        $ref: '#/definitions/DistributionVersion'
      downloads:
        title: Downloads
        type: integer
        readOnly: true
      epoch:
        title: Epoch
        description: The epoch of the package version (if any).
        type: integer
        readOnly: true
        x-nullable: true
      extension:
        title: Extension
        type: string
        readOnly: true
      filename:
        title: Filename
        type: string
        readOnly: true
        minLength: 1
      files:
        type: array
        items:
          $ref: '#/definitions/PackageFile'
        readOnly: true
      format:
        title: Format
        type: string
        readOnly: true
        minLength: 1
      format_url:
        title: Format url
        type: string
        format: uri
        readOnly: true
      freeable_storage:
        title: Freeable storage
        description: Amount of storage that will be freed if this package is deleted
        type: integer
        readOnly: true
      fully_qualified_name:
        title: Fully qualified name
        type: string
        readOnly: true
        minLength: 1
        x-nullable: true
      identifier_perm:
        title: Identifier perm
        description: Unique and permanent identifier for the package.
        type: string
        readOnly: true
        minLength: 1
      identifiers:
        title: Identifiers
        description: Return a map of identifier field names and their values.
        type: object
        additionalProperties:
