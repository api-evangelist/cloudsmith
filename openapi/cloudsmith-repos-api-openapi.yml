        description: Whether the upstream can be reindexed.
        type: boolean
        readOnly: true
      created_at:
        title: Created at
        description: The datetime the upstream source was created.
        type: string
        format: date-time
        readOnly: true
      disable_reason:
        title: Disable reason
        type: string
        enum:
        - N/A
