        readOnly: true
      description:
        title: Description
        type: string
        maxLength: 250
        minLength: 1
        x-nullable: true
      name:
        title: Name
        type: string
        maxLength: 100
        minLength: 1
      on_violation_quarantine:
        title: On violation quarantine
        type: boolean
      package_query_string:
        title: Package query string
        type: string
        minLength: 1
        x-nullable: true
      slug_perm:
        title: Slug perm
        type: string
        format: slug
        pattern: ^[-a-zA-Z0-9_]+$
        readOnly: true
        minLength: 1
      spdx_identifiers:
        type: array
        items:
          type: string
        uniqueItems: true
      updated_at:
        title: Updated at
        type: string
        format: date-time
        readOnly: true
  NestedLicensePolicy:
    required:
